name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-cloudflare-pages.yml"

permissions:
  contents: read

concurrency:
  group: crayons-loop-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing GitHub secret::$key is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          printf '%s' "$RESPONSE" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);if(!j.success)process.exit(1)})"

      - name: Resolve or create Pages projects safely
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects?per_page=100"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$API" > /tmp/pages-projects.json

          resolve_project() {
            local domain="$1"
            local fallback="$2"
            local env_name="$3"
            local project
            project=$(node -e '
              const fs=require("fs");
              const j=JSON.parse(fs.readFileSync("/tmp/pages-projects.json","utf8"));
              if(!j.success) process.exit(2);
              const domain=process.argv[1], fallback=process.argv[2];
              const items=j.result||[];
              const byDomain=items.find(p=>(p.domains||[]).includes(domain));
              const byName=items.find(p=>p.name===fallback);
              process.stdout.write((byDomain||byName||{}).name||"");
            ' "$domain" "$fallback")

            if [ -z "$project" ]; then
              echo "No existing Pages project owns $domain; creating $fallback"
              npx --yes wrangler@latest pages project create "$fallback" --production-branch=main
              project="$fallback"
            else
              echo "Reusing Pages project $project for $domain"
            fi
            echo "$env_name=$project" >> "$GITHUB_ENV"
          }

          resolve_project "www.crayonsloop.com" "crayons-loop-ott-prod" "OTT_PROJECT"
          resolve_project "moments.crayonsloop.com" "crayons-loop-moments-prod" "MOMENTS_PROJECT"
          resolve_project "admin.crayonsloop.com" "crayons-loop-admin-prod" "ADMIN_PROJECT"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck all surfaces
        run: pnpm lint

      - name: Build production exports
        run: pnpm build

      - name: Deploy Crayons Loop OTT
        run: npx --yes wrangler@latest pages deploy apps/ott-web/out --project-name="$OTT_PROJECT" --branch=main --commit-hash="${{ github.sha }}"

      - name: Deploy Crayons Loop Moments
        run: npx --yes wrangler@latest pages deploy apps/moments-web/out --project-name="$MOMENTS_PROJECT" --branch=main --commit-hash="${{ github.sha }}"

      - name: Deploy Crayons Loop Admin
        run: npx --yes wrangler@latest pages deploy apps/admin-cms/out --project-name="$ADMIN_PROJECT" --branch=main --commit-hash="${{ github.sha }}"

      - name: Attach production custom domains
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"

          ensure_domain() {
            local project="$1"
            local domain="$2"
            local list
            list=$(curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$BASE/$project/domains")
            if printf '%s' "$list" | node -e '
              let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                const j=JSON.parse(d), wanted=process.argv[1];
                process.exit((j.result||[]).some(x=>x.name===wanted)?0:1)
              })
            ' "$domain"; then
              echo "$domain is already attached to $project"
              return
            fi
            echo "Attaching $domain to $project"
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"$domain\"}" \
              "$BASE/$project/domains"
          }

          ensure_domain "$OTT_PROJECT" "crayonsloop.com"
          ensure_domain "$OTT_PROJECT" "www.crayonsloop.com"
          ensure_domain "$MOMENTS_PROJECT" "moments.crayonsloop.com"
          ensure_domain "$ADMIN_PROJECT" "admin.crayonsloop.com"

      - name: Wait for valid custom-domain TLS
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          check_domain() {
            local project="$1" domain="$2"
            curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$BASE/$project/domains/$domain" | node -e '
                let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{
                  const j=JSON.parse(d); const status=j.result?.status||"unknown";
                  console.log(process.argv[1]+"="+status);
                  process.exit(status==="active"?0:1)
                })
              ' "$domain"
          }

          for attempt in $(seq 1 30); do
            ready=1
            check_domain "$OTT_PROJECT" "www.crayonsloop.com" || ready=0
            check_domain "$MOMENTS_PROJECT" "moments.crayonsloop.com" || ready=0
            check_domain "$ADMIN_PROJECT" "admin.crayonsloop.com" || ready=0
            if [ "$ready" -eq 1 ]; then
              exit 0
            fi
            sleep 20
          done
          echo "::error title=TLS activation incomplete::One or more Pages custom domains did not become active"
          exit 1

      - name: Verify production health endpoints
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            https://www.crayonsloop.com/healthz.txt \
            https://moments.crayonsloop.com/healthz.txt \
            https://admin.crayonsloop.com/healthz.txt; do
            body=$(curl --silent --show-error --fail-with-body --connect-timeout 10 --max-time 30 "$url")
            test "$body" = "ok"
            echo "$url healthy"
          done
