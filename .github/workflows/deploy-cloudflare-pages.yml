name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  pull_request:
    paths:
      - ".github/workflows/deploy-cloudflare-pages.yml"

permissions:
  contents: read

concurrency:
  group: crayons-loop-production-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wiring-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OTT_PROJECT: ${{ vars.CLOUDFLARE_OTT_PROJECT }}
      MOMENTS_PROJECT: ${{ vars.CLOUDFLARE_MOMENTS_PROJECT }}
      ADMIN_PROJECT: ${{ vars.CLOUDFLARE_ADMIN_PROJECT }}
    steps:
      - name: Report production wiring presence
        shell: bash
        run: |
          report() {
            local label="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "::notice::$label=present"
            else
              echo "::warning::$label=missing"
            fi
          }
          report CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          report CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          report CLOUDFLARE_OTT_PROJECT "$OTT_PROJECT"
          report CLOUDFLARE_MOMENTS_PROJECT "$MOMENTS_PROJECT"
          report CLOUDFLARE_ADMIN_PROJECT "$ADMIN_PROJECT"

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OTT_PROJECT: ${{ vars.CLOUDFLARE_OTT_PROJECT }}
      MOMENTS_PROJECT: ${{ vars.CLOUDFLARE_MOMENTS_PROJECT }}
      ADMIN_PROJECT: ${{ vars.CLOUDFLARE_ADMIN_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production wiring
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$OTT_PROJECT" || { echo "Missing CLOUDFLARE_OTT_PROJECT repository variable"; exit 1; }
          test -n "$MOMENTS_PROJECT" || { echo "Missing CLOUDFLARE_MOMENTS_PROJECT repository variable"; exit 1; }
          test -n "$ADMIN_PROJECT" || { echo "Missing CLOUDFLARE_ADMIN_PROJECT repository variable"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build production exports
        run: pnpm build

      - name: Deploy Crayons Loop OTT
        run: npx --yes wrangler@latest pages deploy apps/ott-web/out --project-name="$OTT_PROJECT" --branch=main --commit-hash="${{ github.sha }}"

      - name: Deploy Crayons Loop Moments
        run: npx --yes wrangler@latest pages deploy apps/moments-web/out --project-name="$MOMENTS_PROJECT" --branch=main --commit-hash="${{ github.sha }}"

      - name: Deploy Crayons Loop Admin
        run: npx --yes wrangler@latest pages deploy apps/admin-cms/out --project-name="$ADMIN_PROJECT" --branch=main --commit-hash="${{ github.sha }}"
